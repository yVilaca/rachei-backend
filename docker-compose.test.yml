# Fonte única da verdade para rodar a suíte contra Postgres.
# GitHub Actions usa isto hoje; Jenkins usará o MESMO alvo amanhã — sem retrabalho.
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rachei_test
      POSTGRES_USER: rachei
      POSTGRES_PASSWORD: rachei
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rachei -d rachei_test"]
      interval: 3s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data  # banco em RAM: efêmero e rápido, some ao fim

  tests:
    build: .
    command: >
      sh -c "python -m coverage run manage.py test --noinput &&
             python -m coverage report"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: rachei_test
      DB_USER: rachei
      DB_PASSWORD: rachei
      DB_HOST: db
      DB_PORT: "5432"
      # Chave Fernet pública só para o ambiente de teste (2FA)
      TOTP_ENCRYPTION_KEY: "YNqvfjrYdzvwqJQQiHQCV_-2eeWNfya4UAHsxiNdNwU="
    depends_on:
      db:
        condition: service_healthy
